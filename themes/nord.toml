# nord — converted from the swatch palette of the same name.
# Edit freely: nous never reads swatch, this file is the whole theme.

[meta]
name = "Nord"
variant = "dark"

[colors]
bg     = "#2e3440"
panel  = "#3b4252"
text   = "#d8dee9"
muted  = "#4c566a"
accent = "#88c0d0"
link   = "#4c566a"

[groups]
# name a group here to pin its colour, e.g.  project = "#ff0000"
cycle = ["#9fd0dd", "#c9a8c4", "#b5cba1", "#f0d9a8", "#8fbcbb", "#d08770", "#88c0d0", "#b48ead"]

[feel]
node_scale   = 1.0
label_size   = 11
link_opacity = 0.26
glow         = true
halftone     = false
duotone      = false
