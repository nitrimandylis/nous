# catppuccin — converted from the swatch palette of the same name.
# Edit freely: nous never reads swatch, this file is the whole theme.

[meta]
name = "Catppuccin Mocha"
variant = "dark"

[colors]
bg     = "#1e1e2e"
panel  = "#313244"
text   = "#cdd6f4"
muted  = "#6c7086"
accent = "#cba6f7"
link   = "#585b70"

[groups]
# name a group here to pin its colour, e.g.  project = "#ff0000"
cycle = ["#94e2d5", "#f5c2e7", "#a6e3a1", "#f9e2af", "#89b4fa", "#f38ba8"]

[feel]
node_scale   = 1.0
label_size   = 11
link_opacity = 0.26
glow         = true
halftone     = false
duotone      = false
