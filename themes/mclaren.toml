# mclaren — converted from the swatch palette of the same name.
# Edit freely: nous never reads swatch, this file is the whole theme.

[meta]
name = "McLaren"
variant = "dark"

[colors]
bg     = "#05090a"
panel  = "#241c1b"
text   = "#c0c3c9"
muted  = "#8d7b75"
accent = "#ff5b02"
link   = "#8d7b75"

[groups]
# name a group here to pin its colour, e.g.  project = "#ff0000"
cycle = ["#689ca9", "#c07a7e", "#93a077", "#ffb000", "#6b88a9", "#ff5b02", "#3a6b72", "#8a4a52"]

[feel]
node_scale   = 1.0
label_size   = 11
link_opacity = 0.26
glow         = true
halftone     = false
duotone      = false
